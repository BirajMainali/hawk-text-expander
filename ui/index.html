<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promptly - A Simple Text Expander - Variables and Shortcuts</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="../styles/site.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="text-center">
        <h1 class="text-2xl font-semibold text-gray-700">Promptly - A Simple Text Expander</h1>
        <p class="text-sm text-gray-500 mt-2">Create shortcuts for your frequently used phrases</p>
    </div>

    <form id="shortcutForm" class="space-y-4">
        <div class="space-y-1">
            <label for="shortcutInput" class="text-sm font-medium text-gray-700">Shortcut</label>
            <input name="shortcut" type="text" id="shortcutInput" placeholder="Enter shortcut (e.g., 'tx')" required>
        </div>
        <div class="space-y-1">
            <label for="textInput" class="text-sm font-medium text-gray-700">Text</label>
            <textarea name="text" id="textInput" rows="4" placeholder="Enter the full text (e.g., 'Thanks!')"
                      required></textarea>
        </div>
        <button type="submit"
                class="bg-gray-800 text-white py-3 rounded-md text-lg font-semibold hover:bg-gray-700 transition duration-300">
            Save Shortcut
        </button>
    </form>

    <hr class="my-6 border-gray-300">

    <h3 class="text-xl font-semibold text-gray-700">Saved Shortcuts (Temporary)</h3>

    <div id="shortcuts">
        <!-- Shortcut items will be rendered here -->
    </div>

    <template id="shortcutTemplate">
        <div class="shortcut-item">
            <div>
                <h5 class="text-lg font-medium text-gray-700" id="shortcut"></h5>
                <p class="text-gray-600" id="text"></p>
            </div>
            <div class="flex space-x-4">
                <button id="edit" class="text-sm font-semibold text-gray-700">Edit</button>
                <button id="delete" class="text-sm font-semibold text-red-500">Delete</button>
            </div>
        </div>
    </template>
</div>

<script src="../scripts/store.js"></script>
<script src="../scripts/site.js"></script>
<script src="../scripts/script.js"></script>
</body>
</html>
